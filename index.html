<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STARTWORKS Technologies</title>
    <!-- Start Single Page Apps for GitHub Pages Route Support -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).reduce(function(r, s) {
            var p = s.split('=');
            r[p[0]] = p[1];
            return r;
          }, {});
          if (decoded.p !== undefined) {
            // Determine base segment count (1 for repo name on GitHub Pages, 0 for custom domains/localhost)
            var pathSegmentsToKeep = (l.hostname === 'localhost' || l.hostname === '127.0.0.1' || l.hostname.indexOf('github.io') === -1) ? 0 : 1;
            window.history.replaceState(null, null,
              l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
              (decoded.p || '') +
              (decoded.q ? ('?' + decoded.q) : '') +
              l.hash
            );
          }
        }
      }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages Route Support -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
